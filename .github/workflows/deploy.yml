name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personalwebsite-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://www.wycgi.cn
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --global pnpm@10.34.6
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package standalone server
        run: |
          mkdir -p .deploy-bundle
          cp -a .next/standalone/. .deploy-bundle/
          cp -a .next/static .deploy-bundle/.next/static
          cp -a public .deploy-bundle/public
          tar --hard-dereference -czf deploy.tar.gz -C .deploy-bundle .

      - name: Deploy over restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          chmod 700 "$secret_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$secret_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$secret_dir/known_hosts"
          chmod 600 "$secret_dir/key" "$secret_dir/known_hosts"
          checksum="$(sha256sum deploy.tar.gz | cut -d ' ' -f 1)"
          ssh -i "$secret_dir/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$secret_dir/known_hosts" -o ConnectTimeout=15 \
            "personalwebsite@$DEPLOY_HOST" "deploy $GITHUB_SHA $checksum" < deploy.tar.gz
